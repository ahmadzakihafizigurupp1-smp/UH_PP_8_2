function jsonp(url,tx,ms=6500){return new Promise((resolve,reject)=>{const name='cbtCallback_'+token();const script=document.createElement('script');let done=false;let timer;const finish=(err,data)=>{if(done)return;done=true;clearTimeout(timer);script.remove();delete window[name];err?reject(err):resolve(data);};window[name]=data=>finish(null,data);script.onerror=()=>finish(new Error('Konfirmasi server tidak dapat dibuka.'));timer=setTimeout(()=>finish(new Error('Konfirmasi server melewati batas waktu.')),ms);const u=new URL(url);u.searchParams.set('action','status');u.searchParams.set('token',tx);u.searchParams.set('callback',name);u.searchParams.set('_',Date.now());script.src=u.toString();document.head.appendChild(script);});}

 function move(i){const old=current.current;if(pageRef.current!=='exam'||old?.status!=='active'||old.warning||modalRef.current||i<0||i>=N)return;if(secondsLeft(old)<=0){finish('Waktu habis',old);return;}commit({...old,active:i});}

 function acknowledge(){const old=current.current;if(old?.status!=='active'||!old.warning)return;if(secondsLeft(old)<=0){finish('Waktu habis',old);return;}commit({...old,warning:false});showModal(null);enterFullscreen();if(!document.hidden){episode.current=false;lastViolation.current=Date.now();}}
 function tick(){const old=current.current;if(pageRef.current!=='exam'||old?.status!=='active')return;const remaining=secondsLeft(old);if(!remaining){finish('Waktu habis',old);return;}if(remaining!==old.remaining)commit({...old,remaining});}
 actionRef.current={tick,violation,acknowledge};
 useEffect(()=>{alive.current=true;const examActive=()=>pageRef.current==='exam'&&current.current?.status==='active';const hidden=()=>{if(!examActive())return;if(document.hidden){if(Date.now()-lastViolation.current>=700||!episode.current)actionRef.current.violation();}else if(!current.current.warning){episode.current=false;actionRef.current.tick();}};const full=()=>{if(!examActive())return;if(document.fullscreenElement){fsArmed.current=true;setFsWarning('');if(!current.current.warning&&!document.hidden)episode.current=false;}else if(fsArmed.current){fsArmed.current=false;if(Date.now()-lastViolation.current<700){if(current.current.warning||episode.current)return;}actionRef.current.violation();}};const block=e=>{if(examActive())e.preventDefault();};const key=e=>{if(!examActive())return;const k=e.key.toLowerCase();const ctrl=e.ctrlKey||e.metaKey;if(k==='f12'||(ctrl&&['c','x','v','a','p','s','u','r','t','n','w','l','o','f'].includes(k))||(ctrl&&e.shiftKey&&['i','j','c','k','r'].includes(k)))e.preventDefault();};const save=()=>{const old=current.current;if(old&&['active','pending'].includes(old.status)){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(old.status==='active'?{...old,remaining:secondsLeft(old)}:old));}catch(e){}}};const interval=setInterval(()=>actionRef.current.tick(),250);document.addEventListener('visibilitychange',hidden);document.addEventListener('fullscreenchange',full);['contextmenu','copy','cut','paste','dragstart'].forEach(x=>document.addEventListener(x,block,true));document.addEventListener('keydown',key,true);window.addEventListener('beforeunload',save);window.addEventListener('pagehide',save);return()=>{alive.current=false;clearInterval(interval);document.removeEventListener('visibilitychange',hidden);document.removeEventListener('fullscreenchange',full);['contextmenu','copy','cut','paste','dragstart'].forEach(x=>document.removeEventListener(x,block,true));document.removeEventListener('keydown',key,true);window.removeEventListener('beforeunload',save);window.removeEventListener('pagehide',save);};},[]);
 const remaining=s?.remaining??EXAM.duration;const count=s?s.order.filter(id=>answered(QUESTIONS.get(id),s.answers[id])).length:0;const locked=!!modal||s?.status!=='active'||s?.warning;
 return <main className={'mx-auto min-h-screen max-w-7xl px-4 py-5 sm:px-7 sm:py-8 '+(page==='exam'?'exam-lock':'')}><Header s={page==='exam'||page==='result'?s:null} remaining={page==='exam'?remaining:undefined}/>{saveWarning&&<div role="alert" className="mb-4 rounded-xl bg-amber-100 p-3 text-sm font-semibold text-amber-950">{saveWarning}</div>}{page==='login'&&<Login onStart={start} url={url} storageError={storageError} onReset={()=>showModal('reset')}/>} {page==='resume'&&s&&<section className="card mx-auto max-w-xl p-7 sm:p-9"><div className="mb-4 inline-flex rounded-2xl bg-sky-100 p-3 text-sky-700"><Icon name="clock" size={28}/></div><h2 className="text-2xl font-bold text-slate-900">Sesi Ujian Tersimpan Ditemukan!</h2><p className="mt-2 text-slate-600">{s.nama} · Kelas {s.kelas} · {s.tanggal}</p><div className="my-5 rounded-xl bg-slate-50 p-4 text-sm text-slate-700"><p>Terjawab: {count}/{N}</p><p>Sisa waktu: {timeText(s.status==='active'?secondsLeft(s):s.remaining)}</p><p>Pelanggaran: {s.violations}/2</p><p>Status: {s.status==='pending'?'Menunggu konfirmasi pengiriman':'Ujian belum selesai'}</p></div>{s.status==='pending'?<button className="btn primary w-full" onClick={resume}>Buka hasil & kirim ulang nilai</button>:<div className="flex flex-wrap gap-2"><button className="btn primary flex-1" onClick={resume}>Lanjutkan Ujian</button><button className="btn secondary flex-1" onClick={()=>showModal('reset')}>Mulai Ulang (Hapus Progres)</button></div>}</section>}{page==='exam'&&s&&<><div className="mb-4 flex flex-wrap items-center justify-between gap-2 rounded-xl border border-white/20 bg-white/10 px-4 py-3 text-sm text-white"><span className="flex items-center gap-2"><Icon name="user" size={17}/> {s.nama} · {s.kelas}</span><span>Progres: {count}/{N} terjawab</span><span>{saveWarning?'Autosave bermasalah':'Autosave aktif'}</span></div>{fsWarning&&<div className="mb-4 flex flex-wrap items-center justify-between gap-2 rounded-xl bg-amber-100 p-3 text-sm text-amber-950"><span>{fsWarning}</span><button disabled={locked} className="font-bold underline" onClick={enterFullscreen}>Aktifkan layar penuh</button></div>}<div className="grid gap-5 lg:grid-cols-[minmax(0,1fr)_320px]"><div><QuestionCard s={s} locked={locked} onAnswer={updateAnswer}/><div className="mt-4 flex flex-wrap justify-between gap-3"><button type="button" disabled={locked||s.active===0} className="btn secondary" onClick={()=>move(s.active-1)}><Icon name="left"/> Sebelumnya</button>{s.active===N-1?<button type="button" disabled={locked} className="btn primary" onClick={()=>showModal('finish')}>Selesai & Kumpulkan <Icon name="send"/></button>:<button type="button" disabled={locked} className="btn primary" onClick={()=>move(s.active+1)}>Selanjutnya <Icon name="right"/></button>}</div></div><NavigationPanel s={s} locked={locked} onNavigate={move} onFinish={()=>showModal('finish')}/></div></>}{page==='result'&&s&&<ResultCard s={s} sending={sending} confirmed={confirmed} error={sendError} onRetry={()=>submitPending()} onExit={()=>{current.current=null;setS(null);navigatePage('login');}}/>}<footer className="mt-8 text-center text-xs text-sky-100/80">CBT · {EXAM.mapel} · Kelas {EXAM.kelas} · {EXAM.jenis}</footer>{modal==='warning'&&<Modal title="PERINGATAN! Pelanggaran pertama" danger actions={<button type="button" className="btn danger w-full" onClick={acknowledge}>Saya mengerti, lanjutkan ujian</button>}>Anda terdeteksi berpindah tab atau keluar dari layar penuh. Pelanggaran berikutnya akan mengakhiri ujian secara otomatis. Kembali ke layar penuh dan tetap berada di halaman ujian.</Modal>}{modal==='finish'&&<Modal title="Kumpulkan jawaban?" actions={<><button className="btn secondary" onClick={()=>showModal(null)}>Periksa lagi</button><button className="btn primary" onClick={()=>finish('Dikumpulkan peserta')}>Ya, kumpulkan</button></>}>Anda telah menjawab {count} dari {N} soal. Masih ada {N-count} soal kosong. Setelah dikumpulkan, jawaban tidak dapat diubah.</Modal>}{modal==='reset'&&<Modal title="Hapus progres ujian?" danger actions={<><button className="btn secondary" onClick={()=>showModal(null)}>Batal</button><button className="btn danger" onClick={reset}>Hapus progres</button></>}>Sesi aktif yang tersimpan akan dihapus dari perangkat ini. Jawaban, waktu dan urutan soal tidak dapat dipulihkan. Sesi menunggu pengiriman tidak dapat dihapus melalui pilihan ini.</Modal>}</main>;
}
